<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlighted Word</title>
</head>
<body>
    <h1>Highlighted</h1>
    <p id="highlighted-text"></p>

    <script>
        const vscode = acquireVsCodeApi();
        document.addEventListener('DOMContentLoaded', () => {
            const highlightedText = vscode.getState().selectedText;
            document.getElementById('highlighted-text').innerText = highlightedText || 'No text selected.';
        });
    </script>
</body>
</html>
